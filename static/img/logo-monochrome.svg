<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <!-- Pure Crisp Monochrome Vector - 100% Black & White -->
  <g transform="translate(15, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#000000" />

    <!-- S Ribbon in White -->
    <path d="M 40 28
             C 28 28, 20 36, 20 46
             C 20 56, 27 63, 40 67
             L 48 70
             C 58 73, 63 79, 63 87
             C 63 97, 53 103, 39 103
             C 26 103, 18 97, 15 89"
          transform="translate(1, -14) scale(0.98)"
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- R Stem in White -->
    <path d="M 57 28 L 57 87" 
          transform="translate(0, -14) scale(0.98)"
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" />

    <!-- R Upper Bowl in White -->
    <path d="M 57 28
             C 74 28, 86 35, 86 49
             C 86 63, 74 69, 57 69"
          transform="translate(0, -14) scale(0.98)"
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- R Kick in White -->
    <path d="M 66 67 L 85 99" 
          transform="translate(0, -14) scale(0.98)"
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" />

    <!-- Center leaf in White -->
    <path d="M 68 47 
             C 68 37, 78 37, 81 45 
             C 81 53, 71 53, 68 47 Z" 
          transform="translate(0, -14) scale(0.98)"
          fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY In Solid Black -->
  <g transform="translate(138, 22)">
    <text x="0" y="42" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="#000000">
      SR ENTERPRISE
    </text>

    <text x="1" y="66" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#333333">
      AGRO &amp; FEED SOLUTIONS
    </text>

    <g transform="translate(1, 86)">
      <text x="0" y="-7" 
            font-family="'Hind Siliguri', 'Segoe UI', sans-serif" 
            font-size="13" 
            font-weight="700" 
            fill="#000000">
        পৌল্ট্রি ও গরুর খাদ্য ও ঔষধ ডিলার
      </text>
    </g>
  </g>
</svg>