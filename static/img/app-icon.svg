<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Center Graphic: Wheat Grain & Rooster Silhouette -->
  <g filter="url(#dropGlow)" fill="#ffffff">
    <!-- Stylized Wheat Stalk -->
    <path d="M256 100 C270 140 270 200 256 240 C242 200 242 140 256 100 Z" fill="#fef08a"/>
    <path d="M210 140 C240 160 250 200 246 230 C220 220 200 180 210 140 Z" fill="#fde047"/>
    <path d="M302 140 C272 160 262 200 266 230 C292 220 312 180 302 140 Z" fill="#fde047"/>
    <path d="M190 200 C220 220 240 250 242 280 C210 270 190 240 190 200 Z" fill="#facc15"/>
    <path d="M322 200 C292 220 272 250 270 280 C302 270 322 240 322 200 Z" fill="#facc15"/>

    <!-- Central SRE Emblem Circle -->
    <circle cx="256" cy="330" r="100" fill="#ffffff" fill-opacity="0.15"/>
    <!-- Feed Bowl / Sprout -->
    <path d="M176 340 C176 390 210 420 256 420 C302 420 336 390 336 340 Z" fill="#ffffff"/>
    <rect x="246" y="240" width="20" height="110" rx="10" fill="#ffffff"/>
  </g>

  <!-- Bengali / English Text -->
  <text x="256" y="468" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="2">SR ENTERPRISE</text>
</svg>
